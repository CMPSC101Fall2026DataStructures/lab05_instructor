name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install project dependencies
        run: uv sync
      - name: Compile Python modules
        run: uv run python -m compileall -q src
      - name: Run GatorGrade checks
        run: |
          python -m pip install gatorgrade
          gatorgrade --config config/gatorgrade.yml
